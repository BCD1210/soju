# didimlabs.com. Deploy with the Cloudflare account that owns the zone (set CLOUDFLARE_ACCOUNT_ID).
name = "soju-site"
main = "worker.js"
compatibility_date = "2026-08-01"

[[routes]]
pattern = "didimlabs.com"
custom_domain = true

[[routes]]
pattern = "www.didimlabs.com"
custom_domain = true

# Sponsor inquiries. The recipient is the SPONSOR_TO secret and must be a verified Email Routing address.
[[send_email]]
name = "MAILER"

# Sign-in results (see auth.js). Wrangler creates the namespace on first deploy.
[[kv_namespaces]]
binding = "AUTH"


# Anonymous play counts from the Soju app (stats.js), at didimlabs.com/api/stats.
[[d1_databases]]
binding = "STATS"
database_name = "soju-stats"
database_id = "b05a49d9-36d2-4731-89ab-d3951243de0a"

# The Didim Labs feed in the Soju app (feed.js), at didimlabs.com/api/feed.
# FEED_ADMINS (a secret): the addresses that may post news and hide posts, comma separated.
[[d1_databases]]
binding = "FEED"
database_name = "soju-feed"
database_id = "bcedd4e6-c2b4-405c-9f8b-92db8ff2f348"
