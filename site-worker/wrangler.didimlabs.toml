# didimlabs.com. Deploy with the Cloudflare account that owns the zone (set CLOUDFLARE_ACCOUNT_ID).
name = "soju-site"
main = "worker.js"
compatibility_date = "2026-08-01"

[[routes]]
pattern = "didimlabs.com"
custom_domain = true

[[routes]]
pattern = "www.didimlabs.com"
custom_domain = true

# Sponsor inquiries. The recipient is the SPONSOR_TO secret and must be a verified Email Routing address.
[[send_email]]
name = "MAILER"

# Sign-in results (see auth.js). Wrangler creates the namespace on first deploy.
[[kv_namespaces]]
binding = "AUTH"

# Anonymous, opt-in usage counts (see community.js). Wrangler creates the database on first deploy.
[[d1_databases]]
binding = "STATS"
database_name = "soju-stats"
