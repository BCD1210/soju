# didimlabs.com. Deploy with the Cloudflare account that owns the zone (set CLOUDFLARE_ACCOUNT_ID).
name = "soju-site"
main = "worker.js"
compatibility_date = "2026-08-01"

[[routes]]
pattern = "didimlabs.com"
custom_domain = true

[[routes]]
pattern = "www.didimlabs.com"
custom_domain = true

# Sponsor inquiries. The recipient is the SPONSOR_TO secret and must be a verified Email Routing address.
[[send_email]]
name = "MAILER"
